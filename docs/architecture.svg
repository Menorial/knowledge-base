<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#4A3F30" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9A8F80"/>
    </marker>
    <symbol id="i-doc" viewBox="0 0 24 24">
      <path d="M7 3.5h6.5L18 8v12.5H7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M13.5 3.5V8H18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9.5 12.5h6M9.5 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-chat" viewBox="0 0 24 24">
      <path d="M4.5 6.5h15v10h-8l-4.5 3.5v-3.5h-2.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M8.5 11h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M15 15l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-graph" viewBox="0 0 24 24">
      <circle cx="6" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="18" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="12" cy="18" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8 8.2l7.6 7.2M16.8 10l-3.4 5.6M8.3 8.6l1.8 7" stroke="currentColor" stroke-width="1.4"/>
    </symbol>
    <symbol id="i-db" viewBox="0 0 24 24">
      <ellipse cx="12" cy="6" rx="7.5" ry="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24">
      <path d="M12 3.5l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5L4.5 11 10 9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="18.5" cy="18.5" r="1.4" fill="currentColor"/>
    </symbol>
    <symbol id="i-chip" viewBox="0 0 24 24">
      <rect x="7" y="7" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M10 3.5V7M14 3.5V7M10 17v3.5M14 17v3.5M3.5 10H7M3.5 14H7M17 10h3.5M17 14h3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="#FAF7F1"/>

  <!-- 标题 -->
  <text x="64" y="66" font-size="28" font-weight="600" fill="#2A2622" letter-spacing="0.5">个人知识库 · 系统架构</text>
  <text x="64" y="96" font-size="13" fill="#8A8175" letter-spacing="2">LOCAL-FIRST  ·  DATA STAYS ON YOUR MACHINE</text>

  <!-- 分层色带 -->
  <rect x="64" y="132" width="1152" height="168" rx="20" fill="#F2EADB" opacity="0.55"/>
  <rect x="64" y="356" width="1152" height="228" rx="20" fill="#E9E3D7" opacity="0.55"/>
  <rect x="64" y="640" width="1152" height="140" rx="20" fill="#F2EADB" opacity="0.55"/>

  <!-- 层名 -->
  <g font-size="13" font-weight="600" fill="#7A6F5F" letter-spacing="2" text-anchor="middle">
    <text x="107" y="221">前端层</text>
    <text x="107" y="475">服务层</text>
    <text x="107" y="715">存储层</text>
  </g>

  <!-- 前端卡片 -->
  <rect x="150" y="156" width="1032" height="120" rx="16" fill="#FFFFFF" stroke="#E8DFD2" filter="url(#cardShadow)"/>
  <text x="178" y="190" font-size="17" font-weight="600" fill="#2A2622">Vue 3 + Vite</text>
  <rect x="292" y="174" width="56" height="21" rx="6" fill="#F6EFE3" stroke="#E6D9C6"/>
  <text x="320" y="189" font-size="11.5" fill="#9A7B4F" text-anchor="middle">:5173</text>

  <g font-size="13.5" fill="#3A342C">
    <rect x="178" y="202" width="232" height="46" rx="11" fill="#FBF7F0" stroke="#E9E0D2"/>
    <use href="#i-doc" x="194" y="215" width="20" height="20" color="#C4673F"/>
    <text x="224" y="230">文档管理</text>

    <rect x="426" y="202" width="232" height="46" rx="11" fill="#FBF7F0" stroke="#E9E0D2"/>
    <use href="#i-chat" x="442" y="215" width="20" height="20" color="#C4673F"/>
    <text x="472" y="230">AI 对话</text>

    <rect x="674" y="202" width="232" height="46" rx="11" fill="#FBF7F0" stroke="#E9E0D2"/>
    <use href="#i-search" x="690" y="215" width="20" height="20" color="#C4673F"/>
    <text x="720" y="230">全文搜索</text>

    <rect x="922" y="202" width="232" height="46" rx="11" fill="#FBF7F0" stroke="#E9E0D2"/>
    <use href="#i-graph" x="938" y="215" width="20" height="20" color="#C4673F"/>
    <text x="968" y="230">知识图谱</text>
  </g>

  <!-- 服务卡片 -->
  <rect x="150" y="380" width="1032" height="180" rx="16" fill="#FFFFFF" stroke="#E8DFD2" filter="url(#cardShadow)"/>
  <text x="178" y="412" font-size="17" font-weight="600" fill="#2A2622">FastAPI</text>
  <rect x="262" y="396" width="56" height="21" rx="6" fill="#EAF1EF" stroke="#D3E3DF"/>
  <text x="290" y="411" font-size="11.5" fill="#2F7D74" text-anchor="middle">:8000</text>

  <text x="178" y="452" font-size="12" fill="#8A8175" letter-spacing="1">API 路由</text>
  <g font-size="13" fill="#3A342C">
    <rect x="300" y="424" width="132" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="366" y="451" text-anchor="middle">文档</text>
    <rect x="444" y="424" width="132" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="510" y="451" text-anchor="middle">对话</text>
    <rect x="588" y="424" width="132" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="654" y="451" text-anchor="middle">搜索</text>
    <rect x="732" y="424" width="132" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="798" y="451" text-anchor="middle">标签</text>
    <rect x="876" y="424" width="132" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="942" y="451" text-anchor="middle">回收站</text>
    <rect x="1020" y="424" width="132" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="1086" y="451" text-anchor="middle">系统</text>
  </g>

  <text x="178" y="506" font-size="12" fill="#8A8175" letter-spacing="1">服务层</text>
  <g font-size="13" fill="#3A342C">
    <rect x="300" y="478" width="111" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="355" y="505" text-anchor="middle">解析</text>
    <rect x="423" y="478" width="111" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="478" y="505" text-anchor="middle">切片</text>
    <rect x="546" y="478" width="111" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="601" y="505" text-anchor="middle">向量化</text>
    <rect x="669" y="478" width="111" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="724" y="505" text-anchor="middle">RAG</text>
    <rect x="792" y="478" width="111" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="847" y="505" text-anchor="middle">链接</text>
    <rect x="915" y="478" width="111" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="970" y="505" text-anchor="middle">剪藏</text>
    <rect x="1038" y="478" width="111" height="44" rx="10" fill="#F7FAF9" stroke="#DCE9E6"/><text x="1093" y="505" text-anchor="middle">备份</text>
  </g>

  <!-- 存储卡片 -->
  <rect x="150" y="660" width="520" height="100" rx="14" fill="#FFFFFF" stroke="#E8DFD2" filter="url(#cardShadow)"/>
  <use href="#i-db" x="176" y="680" width="24" height="24" color="#8A8175"/>
  <text x="212" y="698" font-size="16" font-weight="600" fill="#2A2622">SQLite knowledge.db</text>
  <rect x="212" y="712" width="132" height="30" rx="9" fill="#F6F2EA" stroke="#E7DED0"/>
  <text x="278" y="732" font-size="12.5" fill="#6B6257" text-anchor="middle">FTS5 分词</text>
  <rect x="354" y="712" width="152" height="30" rx="9" fill="#F6F2EA" stroke="#E7DED0"/>
  <text x="430" y="732" font-size="12.5" fill="#6B6257" text-anchor="middle">sqlite-vec 向量</text>

  <rect x="700" y="660" width="482" height="100" rx="14" fill="#FFFFFF" stroke="#E8DFD2" filter="url(#cardShadow)"/>
  <use href="#i-folder" x="726" y="680" width="24" height="24" color="#8A8175"/>
  <text x="762" y="698" font-size="16" font-weight="600" fill="#2A2622">data/files</text>
  <text x="762" y="728" font-size="13" fill="#7A7268">原始文件与剪藏图片</text>

  <!-- 外部依赖 -->
  <text x="1252" y="372" font-size="12" fill="#8A8175" letter-spacing="2">外部依赖</text>
  <rect x="1252" y="392" width="284" height="88" rx="14" fill="#FFFFFF" stroke="#E8DFD2" filter="url(#cardShadow)"/>
  <use href="#i-spark" x="1272" y="414" width="24" height="24" color="#C4673F"/>
  <text x="1308" y="428" font-size="16" font-weight="600" fill="#2A2622">大模型 API</text>
  <text x="1308" y="452" font-size="12" fill="#7A7268">OpenAI 兼容接口</text>

  <rect x="1252" y="504" width="284" height="88" rx="14" fill="#FFFFFF" stroke="#E8DFD2" filter="url(#cardShadow)"/>
  <use href="#i-chip" x="1272" y="526" width="24" height="24" color="#2F7D74"/>
  <text x="1308" y="540" font-size="16" font-weight="600" fill="#2A2622">本地 BGE</text>
  <text x="1308" y="564" font-size="12" fill="#7A7268">向量模型 · 512 维</text>

  <!-- 连线 -->
  <g stroke="#9A8F80" stroke-width="1.6" fill="none" stroke-linecap="round">
    <!-- 前端 → 后端：REST 实线 + SSE 虚线 -->
    <path d="M644 276 L644 380" marker-end="url(#arrow)"/>
    <path d="M688 276 L688 380" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

    <!-- 后端 ↔ 存储 -->
    <path d="M410 560 L410 660" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M941 560 L941 660" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- 后端 ↔ 外部 -->
    <path d="M1182 436 L1252 436" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M1182 548 L1252 548" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>

  <g font-size="12" fill="#7A7268">
    <text x="632" y="334" text-anchor="end">REST</text>
    <text x="700" y="334">SSE</text>
    <rect x="390" y="602" width="40" height="22" rx="7" fill="#FFFFFF" stroke="#E8DFD2"/>
    <text x="410" y="617" text-anchor="middle" dominant-baseline="middle">读写</text>
    <rect x="921" y="602" width="40" height="22" rx="7" fill="#FFFFFF" stroke="#E8DFD2"/>
    <text x="941" y="617" text-anchor="middle" dominant-baseline="middle">读写</text>
    <text x="1217" y="424" text-anchor="middle">HTTPS</text>
    <text x="1217" y="536" text-anchor="middle">本地推理</text>
  </g>

  <!-- 图例 -->
  <g font-size="12.5" fill="#7A7268">
    <path d="M64 820 L112 820" stroke="#9A8F80" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="124" y="825">同步请求</text>
    <path d="M64 856 L112 856" stroke="#9A8F80" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="124" y="861">流式输出（SSE）</text>
  </g>

  <text x="1536" y="860" font-size="12" fill="#A79C8C" text-anchor="end">数据与索引全部保存在本机</text>
</svg>
